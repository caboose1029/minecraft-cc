kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g

# openjdk@21 is a Homebrew keg-only formula, not symlinked into the system
# JDK path or PATH by default. Pinning it here means `./gradlew` just works
# without exporting JAVA_HOME manually every time.
org.gradle.java.home=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
